name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: care
          POSTGRES_USER: care
          POSTGRES_PASSWORD: care-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U care -d care"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: care-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Wait for stable PostgreSQL SQL connectivity
        run: |
          required_successes=3
          consecutive_successes=0
          max_attempts=30

          for attempt in $(seq 1 "$max_attempts"); do
            if result=$(psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -Atqc "SELECT 1" 2>/dev/null) && [ "$result" = "1" ]; then
              consecutive_successes=$((consecutive_successes + 1))
              echo "PostgreSQL SQL readiness check ${consecutive_successes}/${required_successes} succeeded."
              if [ "$consecutive_successes" -eq "$required_successes" ]; then
                exit 0
              fi
            else
              consecutive_successes=0
              echo "PostgreSQL SQL readiness attempt ${attempt}/${max_attempts} did not succeed; retrying."
            fi
            sleep 1
          done

          echo "::error::PostgreSQL did not sustain ${required_successes} successful SQL readiness checks within ${max_attempts} attempts."
          exit 1
      - name: Apply database migrations
        run: |
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0001_foundation.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0002_cms_provider_information.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0003_provider_information_load.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0004_inspection_deficiency_penalty.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0005_regulatory_load_stage.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0006_pbj_staffing.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0007_ownership_organization_graph.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0008_cms_chain_intelligence.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0009_location_reference.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0010_consumer_search_indexes.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0011_trust_participation.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0012_facility_intelligence_evidence_identity.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0013_facility_identity_pilot_manifest.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0020_assisted_living_pilot.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0021_nursing_home_national_evidence.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0022_cms_refresh_governance.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0023_home_health_hospice_national.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0024_ownership_graph.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0025_ownership_change_intelligence.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0026_senior_intelligence.sql
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 -f db/migrations/0027_provider_intelligence.sql
      - name: Verify migration objects
        run: |
          psql -h localhost -U care -d care -v ON_ERROR_STOP=1 <<'SQL'
          SELECT PostGIS_Version();
            SELECT to_regclass('public.source_release') IS NOT NULL AS source_release_exists;
            SELECT to_regclass('public.location_reference') IS NOT NULL AS location_reference_exists;
            SELECT to_regclass('public.trust_request') IS NOT NULL AS trust_request_exists;
          SELECT to_regclass('public.provider_context_submission') IS NOT NULL AS provider_context_exists;
          SELECT to_regclass('public.trusthub_manual_override') IS NOT NULL AS trust_override_exists;
          SELECT to_regclass('public.trust_audit_event') IS NOT NULL AS trust_audit_exists;
          SELECT to_regclass('public.cms_chain_performance_snapshot') IS NOT NULL AS chain_snapshot_exists;
          SELECT to_regclass('public.facility_source_observation') IS NOT NULL AS facility_observation_exists;
          SELECT to_regclass('public.facility_claim') IS NOT NULL AS facility_claim_exists;
          SELECT to_regclass('public.facility_identity_candidate') IS NOT NULL AS facility_candidate_exists;
          SELECT to_regclass('public.facility_review_item') IS NOT NULL AS facility_review_exists;
          SELECT to_regclass('public.facility_external_request_cache') IS NOT NULL AS facility_cache_exists;
          SELECT to_regclass('public.assisted_living_provider') IS NOT NULL AS assisted_living_provider_exists;
          SELECT to_regclass('public.cms_facility_designation') IS NOT NULL AS cms_facility_designation_exists;
          SELECT to_regclass('public.provider_npi_relationship') IS NOT NULL AS provider_npi_relationship_exists;
          SELECT to_regclass('public.quality_measure_definition') IS NOT NULL AS quality_measure_definition_exists;
          SELECT to_regclass('public.facility_quality_measure_observation') IS NOT NULL AS facility_qm_exists;
          SELECT to_regclass('public.provider_directory_status') IS NOT NULL AS directory_status_exists;
          SELECT to_regclass('public.fire_safety_citation') IS NOT NULL AS fire_safety_citation_exists;
          SELECT to_regclass('public.cms_refresh_run') IS NOT NULL AS cms_refresh_run_exists;
          SELECT to_regclass('public.cms_source_run') IS NOT NULL AS cms_source_run_exists;
          SELECT to_regclass('public.cms_refresh_source_policy') IS NOT NULL AS cms_refresh_policy_exists;
          SELECT to_regclass('public.cms_source_freshness') IS NOT NULL AS cms_source_freshness_exists;
          SELECT to_regclass('public.home_health_snapshot') IS NOT NULL AS home_health_snapshot_exists;
          SELECT to_regclass('public.hospice_snapshot') IS NOT NULL AS hospice_snapshot_exists;
          SELECT to_regclass('public.cms_agency_quality_observation') IS NOT NULL AS agency_quality_exists;
          SELECT to_regclass('public.provider_organization_edge') IS NOT NULL AS ownership_graph_exists;
          SELECT to_regclass('public.organization_name_observation') IS NOT NULL AS org_name_obs_exists;
          SELECT to_regclass('public.ownership_change_event_party') IS NOT NULL AS chow_party_exists;
          SELECT to_regclass('public.ownership_change_relationship_link') IS NOT NULL AS chow_link_exists;
          SELECT to_regclass('public.provider_ownership_timeline') IS NOT NULL AS chow_timeline_exists;
          SELECT to_regclass('public.senior_intelligence_snapshot') IS NOT NULL AS senior_intel_exists;
          SELECT to_regclass('public.cms_agency_quality_provider_idx') IS NOT NULL AS profile_quality_idx;
          SELECT to_regclass('public.assisted_living_organization_party') IS NOT NULL AS assisted_living_party_exists;
          SELECT EXISTS (
            SELECT 1 FROM information_schema.columns
            WHERE table_name='facility_intelligence_run_provider'
              AND column_name='selection_metadata'
          ) AS pilot_manifest_metadata_exists;
          SELECT to_regclass('public.raw_object') IS NOT NULL AS raw_object_exists;
          SELECT to_regclass('public.ingest_run') IS NOT NULL AS ingest_run_exists;
          SELECT to_regclass('public.facility_snapshot_location_gix') IS NOT NULL AS location_index_exists;
          SELECT to_regclass('public.inspection_event') IS NOT NULL AS inspection_event_exists;
          SELECT to_regclass('public.deficiency_finding') IS NOT NULL AS deficiency_finding_exists;
          SELECT to_regclass('public.penalty_enforcement') IS NOT NULL AS penalty_enforcement_exists;
          SELECT to_regclass('public.regulatory_load_stage') IS NOT NULL AS regulatory_stage_exists;
          SELECT to_regclass('public.pbj_staffing_day') IS NOT NULL AS pbj_day_exists;
          SELECT to_regclass('public.pbj_staffing_quarter_summary') IS NOT NULL AS pbj_summary_exists;
          SELECT to_regclass('public.pbj_staffing_load_stage') IS NOT NULL AS pbj_stage_exists;
          SELECT to_regclass('public.organization') IS NOT NULL AS organization_exists;
          SELECT to_regclass('public.organization_identifier') IS NOT NULL AS organization_identifier_exists;
          SELECT to_regclass('public.provider_ownership_relationship') IS NOT NULL AS ownership_relationship_exists;
          SELECT to_regclass('public.ownership_change_event') IS NOT NULL AS ownership_change_exists;
          SELECT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conname = 'facility_snapshot_raw_object_release_fk'
          ) AS raw_lineage_constraint_exists;
          DO $$
          DECLARE
            request_id uuid;
            status_rows integer;
            audit_rows integer;
            append_only_blocked boolean := false;
          BEGIN
            INSERT INTO trust_request (
              request_type, submitter_name, submitter_role, submitter_organization,
              submitter_email, factual_description
            ) VALUES (
              'profile_claim', 'Synthetic CI reviewer', 'Administrator', 'Synthetic CI organization',
              'ci@example.invalid', 'Synthetic migration verification; not a real provider claim.'
            ) RETURNING id INTO request_id;

            UPDATE trust_request SET status='under_review' WHERE id=request_id;
            SELECT count(*) INTO status_rows FROM trust_request_status_history WHERE trust_request_id=request_id;
            SELECT count(*) INTO audit_rows FROM trust_audit_event WHERE trust_request_id=request_id;
            IF status_rows <> 2 OR audit_rows <> 2 THEN
              RAISE EXCEPTION 'trust audit triggers did not append expected events';
            END IF;

            BEGIN
              UPDATE trust_audit_event SET event_data='{}'::jsonb WHERE trust_request_id=request_id;
            EXCEPTION WHEN raise_exception THEN
              append_only_blocked := true;
            END;
            IF NOT append_only_blocked THEN
              RAISE EXCEPTION 'append-only trust audit unexpectedly allowed UPDATE';
            END IF;
          END $$;
          SQL
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run database integration tests
        working-directory: services/ingest
        env:
          CARE_DATABASE_URL: postgresql://care:care-ci-only@localhost:5432/care
        run: |
          python -m pip install -e ".[dev]"
          pytest -m integration

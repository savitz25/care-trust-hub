name: CMS refresh check

# Daily metadata check only. Production evidence writes are not scheduled.
# A dispatch refresh still requires repository secret CARE_CMS_REFRESH_WRITES=true.
# Full MDS / fire / PBJ loads exceed GitHub-hosted runner time and disk; run those
# from a durable worker with `python -m care_ingest cms-refresh --mode refresh`.

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check (default), dry_run, or refresh"
        required: true
        default: check
        type: choice
        options:
          - check
          - dry_run
          - refresh
      source:
        description: "all or one dataset_key"
        required: true
        default: all
        type: string

concurrency:
  group: cms-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cms-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ingest
    env:
      CARE_DATABASE_URL: ${{ secrets.CARE_DATABASE_URL }}
      CARE_DATA_ROOT: ${{ runner.temp }}/care-data
      CARE_CMS_REFRESH_WRITES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'refresh' && secrets.CARE_CMS_REFRESH_WRITES || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingest/pyproject.toml
      - name: Install ingest package
        run: python -m pip install -e .
      - name: Create archive root
        run: mkdir -p "$CARE_DATA_ROOT"
      - name: Refuse unattended write scheduling
        if: github.event_name == 'schedule'
        run: |
          if [ "${CARE_CMS_REFRESH_WRITES}" = "true" ]; then
            echo "::error::Scheduled CMS jobs must remain check-only."
            exit 1
          fi
      - name: Run CMS refresh
        id: refresh
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'check' }}"
          SOURCE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source || 'all' }}"
          TRIGGER="${{ github.event_name == 'schedule' && 'scheduled' || 'dispatch' }}"
          python -m care_ingest cms-refresh --mode "$MODE" --source "$SOURCE" --trigger "$TRIGGER" | tee "$RUNNER_TEMP/cms-refresh.json"
      - name: Summarize
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cms-refresh.json"
          if not path.exists():
              print("No refresh artifact")
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          lines = [
              "## CMS refresh",
              f"- mode: `{report.get('mode')}`",
              f"- trigger: `{report.get('trigger')}`",
              f"- health: `{report.get('health')}`",
              f"- writes_enabled: `{report.get('writes_enabled')}`",
              "",
              "| source | status | failure |",
              "| --- | --- | --- |",
          ]
          for item in report.get("sources", []):
              lines.append(
                  f"| {item.get('dataset_key')} | {item.get('status')} | {item.get('failure_class') or ''} |"
              )
              if item.get("status") == "DISCOVERED":
                  print(f"::warning::{item.get('dataset_key')} changed; writes were not applied in this job")
              if item.get("status") in {"FAILED", "QUARANTINED", "DATA_LOADED_DERIVE_FAILED"}:
                  print(f"::error::{item.get('dataset_key')} {item.get('status')}: {item.get('error') or ''}")
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

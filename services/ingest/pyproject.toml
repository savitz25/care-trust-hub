[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "care-ingest"
version = "0.1.0"
description = "Ingestion foundation for the care intelligence platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.11"]

[project.scripts]
care-ingest = "care_ingest.cli:main"

[tool.hatch.build]
include = ["src/care_ingest/**/*.py", "src/care_ingest/resources/*.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/care_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
